name: Lovio
options:
  bundleIdPrefix: com.bsekapps
  developmentLanguage: en
  knownRegions:
    - en
    - fr
    - de
    - ko
    - pt
    - es
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: 2BHW8URYW7
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  RevenueCat:
    # Lightweight official mirror (binary-friendly, ~100x smaller checkout
    # than purchases-ios). Same RevenueCat product.
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 18.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  TikTokBusinessSDK:
    url: https://github.com/tiktok/tiktok-business-ios-sdk
    from: 1.6.0

targets:
  Lovio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        type: folder.assetcatalog
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: LovioWidgets
      - package: Firebase
        products:
          - FirebaseAuth
          - FirebaseFirestore
          - FirebaseStorage
          - FirebaseFunctions
          - FirebaseMessaging
          - FirebaseAnalytics
          - FirebaseRemoteConfig
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Facebook
        product: FacebookCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: TikTokBusinessSDK
        product: TikTokBusinessSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bsekapps.lovio
        # User-visible product/bundle name (App Store Connect, Transporter).
        # The Xcode target keeps its internal "Lovio" name; module stays stable.
        PRODUCT_NAME: Missuo
        PRODUCT_MODULE_NAME: Lovio
        # iPhone-only. XcodeGen overrides project-level device family with
        # "1,2" at the target level, which trips App Store validation
        # (ITMS-90474: iPad multitasking needs all four orientations).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Lovio.entitlements
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.0.1
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        OTHER_LDFLAGS: "$(inherited) -ObjC"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Lovio-Release.entitlements
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Config/Lovio-Info.plist
      properties:
        CFBundleDisplayName: Missuo
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Apple App Store public SDK key (RevenueCat → Project settings → API keys).
        RevenueCatPublicAPIKey: "appl_dhTjZcLGCpygTpPiMXhGjbQxRaF"
        # Plain launch screen: iOS caches launch screens aggressively and a
        # raw full-bleed image reads as "app stuck on a logo". The in-app
        # loading view shows the brand mark properly instead.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Opts out of iPad multitasking — belt-and-suspenders with the
        # iPhone-only device family for App Store validation.
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSUserTrackingUsageDescription: "We use this to measure ads and improve Missuo. Your relationship data is never sold."
        NSPhotoLibraryUsageDescription: "Add photos to your shared journal and widgets."
        NSCameraUsageDescription: "Capture moments together directly into your journal."
        NSMicrophoneUsageDescription: "Record voice memories for your partner."
        NSLocationWhenInUseUsageDescription: "Show the distance between you and your partner on widgets."
        NSCalendarsFullAccessUsageDescription: "Sync your shared dates with Apple Calendar."
        NSFaceIDUsageDescription: "Protect your private journal entries."
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        FirebaseAppDelegateProxyEnabled: false
        # TikTok App Events SDK — fill both from TikTok Events Manager
        # (Assets → Events → App → your app). Empty = SDK stays idle.
        TikTokAppID: "7676057087091539989"
        TikTokAccessToken: "TTdFlC0mrBvVyWi3T4rZQG1gyQw4XVad"
        # Meta (Facebook) SDK
        FacebookAppID: "979262581823967"
        FacebookClientToken: "1b520885a9114034b880f96321902e7f"
        FacebookDisplayName: Missuo
        FacebookAutoLogAppEventsEnabled: true
        FacebookAdvertiserIDCollectionEnabled: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - missuo
          - CFBundleURLSchemes:
              - fb979262581823967
        # AdMob production app ID (bsekapps).
        GADApplicationIdentifier: "ca-app-pub-8078875407027697~8878796208"
