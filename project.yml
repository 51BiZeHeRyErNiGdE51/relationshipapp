  LovioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
        type: folder.assetcatalog
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/WidgetsPrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bsekapps.lovio.widgets
        PRODUCT_NAME: MissuoWidgets
        PRODUCT_MODULE_NAME: LovioWidgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/LovioWidgets.entitlements
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.0.1
    info:
